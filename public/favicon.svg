<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64">
  <!-- Outer metallic ring -->
  <circle cx="50" cy="50" r="48" fill="none" stroke="url(#ring-grad)" stroke-width="5"/>
  
  <!-- Recycling arrows - metallic silver -->
  <defs>
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c8d0da;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#8fa0b5;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#b0bccb;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="arrow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4dce8;stop-opacity:1"/>
      <stop offset="40%" style="stop-color:#9aaec4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#6b8299;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Arrow 1: top-right pointing down-left -->
  <path d="M62 18 L75 18 L68 30 L62 18 Z M62 18 L58 35 Q54 48 45 55 L45 42 L36 54 L48 66 L48 55 Q58 50 64 38 L70 22 Z"
    fill="url(#arrow-grad)" />

  <!-- Arrow 2: bottom pointing right -->
  <path d="M38 82 L25 82 L32 70 L38 82 Z M38 82 L42 65 Q46 52 56 47 L56 60 L65 48 L53 36 L53 47 Q43 50 38 62 L32 78 Z"
    fill="url(#arrow-grad)" />

  <!-- Arrow 3: left pointing up -->
  <path d="M18 52 L18 39 L30 46 L18 52 Z M18 52 L34 50 Q46 48 50 38 L38 38 L50 28 L62 40 L50 40 Q46 50 34 56 L20 58 Z"
    fill="url(#arrow-grad)" transform="rotate(0,50,50)"/>
</svg>